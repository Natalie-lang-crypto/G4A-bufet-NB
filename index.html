<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<title>Objednávka školního bufetu</title>

<style>
body {
  font-family: Arial, sans-serif;
  background: #f4f7fb;
}
h1 {
  text-align: center;
  background: #2a72d4;
  color: white;
  padding: 20px;
}
.container {
  width: 90%;
  max-width: 500px;
  margin: 30px auto;
  background: white;
  padding: 25px;
  border-radius: 12px;
}
.item {
  display: flex;
  justify-content: space-between;
  margin: 12px 0;
  font-size: 18px;
}
input[type="number"] {
  width: 70px;
  text-align: center;
}

/* ✅ NOVÁ POLE */
.form-group {
  margin-top: 15px;
}

input[type="text"] {
  width: 100%;
  padding: 10px;
  margin-top: 5px;
}

/* Výstupy */
#celkem, #pocet {
  text-align: center;
  font-size: 22px;
  margin-top: 15px;
  font-weight: bold;
  color: #2a72d4;
}

button {
  width: 100%;
  padding: 15px;
  margin-top: 20px;
  font-size: 24px;
  background: #ff6b35;
  color: white;
  border-radius: 10px;
  cursor: pointer;
}
</style>
</head>

<body>

<h1>SŠ Kostka – OBJEDNÁVKY BUFET</h1>

<div class="container">

<!-- 🟡 POLOŽKY -->
<div class="item">
  <span>SENDVIČ (45 Kč)</span>
  <input type="number" id="sandwich" value="0" min="0">
</div>

<div class="item">
  <span>PÁREK V ROHLÍKU (35 Kč)</span>
  <input type="number" id="parek" value="0" min="0">
</div>

<div class="item">
  <span>JABLKO (15 Kč)</span>
  <input type="number" id="apple" value="0" min="0">
</div>

<!-- 🟢 Součty -->
<div id="celkem">Celková cena: 0 Kč</div>
<div id="pocet">Počet kusů: 0</div>

<!-- ================================= -->
<!-- ✅ NOVÁ POVINNÁ POLE -->
<!-- ================================= -->

<div class="form-group">
  <label><b>VAŠE JMÉNO</b></label>
  <input type="text" id="jmeno" placeholder="Novák Jan">
</div>

<div class="form-group">
  <label><b>TELEFON</b></label>
  <input type="text" id="telefon" placeholder="+420 000 000 000">
</div>

<!-- 🔴 TLAČÍTKO -->
<button onclick="odeslatObjednavku()">ODESLAT OBJEDNÁVKU</button>

</div>

<script>

// Cenový model
const prices = {
  sandwich: 45,
  parek: 35,
  apple: 15
};

// Přepočet
document.querySelectorAll("input[type='number']").forEach(el => {
  el.addEventListener("input", spocitej);
});

function spocitej() {
  let s = +document.getElementById("sandwich").value;
  let p = +document.getElementById("parek").value;
  let a = +document.getElementById("apple").value;

  let cena = s*45 + p*35 + a*15;
  let kusy = s + p + a;

  document.getElementById("celkem").textContent = "Celková cena: " + cena + " Kč";
  document.getElementById("pocet").textContent = "Počet kusů: " + kusy;
}


/* ============================================ */
/* ✅ HLAVNÍ FUNKCE – MAILTO OBJEDNÁVKA */
/* ============================================ */
function odeslatObjednavku(){

  let jmeno = document.getElementById("jmeno").value.trim();
  let telefon = document.getElementById("telefon").value.trim();

  /* ✅ VALIDACE */
  if(!jmeno || !telefon){
    alert("Vyplňte jméno i telefon.");
    return;
  }

  let s = +document.getElementById("sandwich").value;
  let p = +document.getElementById("parek").value;
  let a = +document.getElementById("apple").value;

  let cena = s*45 + p*35 + a*15;
  let kusy = s + p + a;

  /* ✅ TEXT EMAILU */
  let body =
    "OBJEDNÁVKA BUFET\n\n" +
    "Jméno: " + jmeno + "\n" +
    "Telefon: " + telefon + "\n\n" +

    "Položky:\n" +
    "SENDVIČ: " + s + " ks (" + s*45 + " Kč)\n" +
    "PÁREK: " + p + " ks (" + p*35 + " Kč)\n" +
    "JABLKO: " + a + " ks (" + a*15 + " Kč)\n\n" +

    "Počet kusů: " + kusy + "\n" +
    "Celkem: " + cena + " Kč";

  /* ✅ MAILTO IMPLEMENTACE */
  let mailto =
    "mailto:machalek.roman@kostka-skola.cz" +
    "?subject=" + encodeURIComponent("Objednávka bufet") +
    "&body=" + encodeURIComponent(body);

  // 🔵 otevře email klienta
  window.location.href = mailto;
}

</script>

</body>
</html>
